name: Bundle horror music

on:
  push:
    branches:
      - fix/real-music-xtts
    paths:
      - .github/workflows/music-assets.yml

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/real-music-xtts

      - name: Download CC0 loops
        run: |
          mkdir -p public/audio/music
          curl -L --fail --retry 3 -o public/audio/music/abandoned-passages.ogg https://opengameart.org/sites/default/files/freezer_0.ogg
          curl -L --fail --retry 3 -o public/audio/music/lurking-evil.ogg https://opengameart.org/sites/default/files/evil_0.ogg
          test -s public/audio/music/abandoned-passages.ogg
          test -s public/audio/music/lurking-evil.ogg

      - name: Commit music
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/music
          git commit -m "Add CC0 horror music loops"
          git push origin HEAD:fix/real-music-xtts
