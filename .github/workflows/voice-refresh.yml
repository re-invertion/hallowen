name: Voice refresh

on:
  push:
    branches:
      - feature/audio-overhaul
    paths:
      - .github/workflows/voice-refresh.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/audio-overhaul

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TTS and mastering tools
        run: |
          pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Regenerate voices
        env:
          FORCE_REGENERATE: "1"
        run: python scripts/generate-voices.py

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/*.mp3 public/audio/transcript.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh neural voice assets"
          git push origin HEAD:feature/audio-overhaul
