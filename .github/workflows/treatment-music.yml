name: Bundle treatment ward music

on:
  push:
    branches:
      - feature/treatment-ward
    paths:
      - .github/workflows/treatment-music.yml

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/treatment-ward

      - name: Download CC0 treatment ambience
        run: |
          mkdir -p public/audio/music
          curl -L --fail --retry 3 -o public/audio/music/lost-bad-place.ogg https://opengameart.org/sites/default/files/lost.ogg
          test -s public/audio/music/lost-bad-place.ogg

      - name: Commit music
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/music/lost-bad-place.ogg
          git diff --cached --quiet && exit 0
          git commit -m "Add treatment ward music loop"
          git pull --rebase origin feature/treatment-ward
          git push origin HEAD:feature/treatment-ward
