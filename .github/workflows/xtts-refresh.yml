name: XTTS voice refresh

on:
  push:
    branches:
      - fix/real-music-xtts
    paths:
      - .github/workflows/xtts-refresh.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COQUI_TOS_AGREED: "1"
      FORCE_REGENERATE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/real-music-xtts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install XTTS
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.7.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers<5" coqui-tts==0.27.5

      - name: Generate Polish narration
        run: python scripts/generate-voices.py

      - name: Commit voice assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/*.mp3 public/audio/transcript.json
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate narration with XTTS v2"
          git pull --rebase origin fix/real-music-xtts
          git push origin HEAD:fix/real-music-xtts
