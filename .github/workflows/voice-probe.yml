name: Voice probe

on:
  push:
    branches:
      - feature/audio-overhaul
    paths:
      - .github/workflows/voice-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: List neural voices
        run: |
          pip install edge-tts
          python - <<'PY'
          import asyncio
          import edge_tts

          async def main():
              voices = await edge_tts.list_voices()
              for v in voices:
                  name = v.get("ShortName", "")
                  locale = v.get("Locale", "")
                  if locale == "pl-PL" or "Multilingual" in name:
                      print(name, v.get("Gender"), locale)

          asyncio.run(main())
          PY
